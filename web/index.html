<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Inference Lab</title><style>body{background:#08111f;color:#eaf1fc;font:16px system-ui;margin:0;min-height:100vh;display:grid;place-items:center}main{width:min(700px,90vw);background:#101e34;padding:2rem;border-radius:16px}input,button{padding:.7rem;margin:.5rem 0}button{border:0;border-radius:6px;background:#44d998;font-weight:700}pre{background:#07101d;padding:1rem;overflow:auto}</style><main><small>AI INFERENCE LAB · PHASE 1</small><h1>Human detection</h1><p>Upload a JPEG, PNG, or WebP. The request is accepted asynchronously and processed by a bounded ONNX Runtime CPU worker.</p><input id="file" type="file" accept="image/jpeg,image/png,image/webp"><br><button onclick="submitJob()">Submit inference</button><p id="state">Awaiting upload</p><pre id="result">Results will appear here.</pre></main><script>async function submitJob(){const file=document.querySelector('#file').files[0];if(!file)return alert('Choose an image');const body=new FormData();body.append('file',file);const response=await fetch('/api/v1/inference/image',{method:'POST',body});const data=await response.json();if(!response.ok){result.textContent=JSON.stringify(data,null,2);return}state.textContent='QUEUED · '+data.request_id;const timer=setInterval(async()=>{const job=await (await fetch(data.status_url)).json();state.textContent=job.status+' · queue '+(job.queue_latency_ms??'—')+' ms · processing '+(job.processing_time_ms??'—')+' ms';result.textContent=JSON.stringify(job,null,2);if(['COMPLETED','FAILED'].includes(job.status))clearInterval(timer)},500)}</script></html>
